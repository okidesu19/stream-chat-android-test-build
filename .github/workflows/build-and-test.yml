name: Android Build and Test

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug_build:
    name: Build Debug
    runs-on: ubuntu-22.04
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build Debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            **/build/outputs/apk/**/*debug*.apk
            **/build/outputs/bundle/**/*debug*.aab
          retention-days: 7

  release_build:
    name: Build Release
    runs-on: ubuntu-22.04
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build Release
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: |
            **/build/outputs/apk/**/*release*.apk
            **/build/outputs/bundle/**/*release*.aab
          retention-days: 7

  tests:
    name: Run Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Run Unit Tests
        run: |
          if [ -f "./scripts/ci-unit-tests.sh" ]; then
            chmod +x ./scripts/ci-unit-tests.sh
            ./scripts/ci-unit-tests.sh
          else
            ./gradlew testDebugUnitTest --no-daemon
          fi

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 30

  upload_xml_sample:
    name: Upload XML Sample
    runs-on: ubuntu-22.04
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build XML Sample
        run: ./gradlew stream-chat-android-ui-components-sample:assembleDemoDebug --no-daemon

      - name: Upload XML Sample APK
        uses: actions/upload-artifact@v4
        with:
          name: xml-sample-apk
          path: ./stream-chat-android-ui-components-sample/build/outputs/apk/demo/debug/stream-chat-android-ui-components-sample-demo-debug.apk
          retention-days: 7

  upload_compose_sample:
    name: Upload Compose Sample
    runs-on: ubuntu-22.04
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build Compose Sample
        run: ./gradlew stream-chat-android-compose-sample:assembleDebug --no-daemon

      - name: Upload Compose Sample APK
        uses: actions/upload-artifact@v4
        with:
          name: compose-sample-apk
          path: ./stream-chat-android-compose-sample/build/outputs/apk/debug/stream-chat-android-compose-sample-debug.apk
          retention-days: 7

  build_summary:
    name: Build Summary
    runs-on: ubuntu-22.04
    needs: [debug_build, release_build, tests, upload_xml_sample, upload_compose_sample]
    if: always()
    steps:
      - name: Show Summary
        run: |
          echo "✅ Build Process Completed"
          echo "📦 Available Artifacts:"
          echo "   - debug-apks (All debug APKs)"
          echo "   - release-apks (All release APKs)"
          echo "   - test-results (Test reports)"
          echo "   - xml-sample-apk (XML Sample APK)"
          echo "   - compose-sample-apk (Compose Sample APK)"
          echo ""
          echo "View artifacts in GitHub Actions artifacts section"
